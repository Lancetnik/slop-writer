[project]
name = "slop-writer"
version = "0.4.0"
description = "Telegram channel analytics as MCP tools: the server behind the slop-writer skill, and the library behind both."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Lancetnik", email = "nikita@pastukhov-dev.ru" }]
keywords = ["telegram", "analytics", "telethon", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

# One flat set, no extras (#13). Not every module needs both — `db`, `errors`
# and `query` are stdlib-only, `markdown` is the sole mistune user — but
# splitting them into extras buys a few MB at the cost of every caller having
# to know which extra a module lives behind. Revisit if the set grows heavy.
#
# `typer` is gone as of 0.2.0: the domain raises
# `slop_writer.errors.SlopWriterError` instead of reporting its own failures,
# so nothing in the library knows what a CLI is. `slop_writer.cli` is a CLI and
# uses argparse — a three-flag launcher for the server does not earn a
# framework in every installed copy.
#
# python-dotenv arrived with 0.3.0 for the same reason it was absent before:
# the rule is that whoever decides the project root populates the environment,
# and `serve` is now one of those callers. `tg.py` still only reads os.environ.
#
# `mcp` is pinned below 2: `structured_output=False` is probed and depended on
# in that line (#16), and v2 moved FastMCP to `mcp.server.mcpserver.MCPServer`
# with unverified kwargs.
dependencies = [
    "telethon>=1.36,<2",
    "mistune>=3.0",
    "mcp>=1.10,<2",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Lancetnik/slop-writer"
Issues = "https://github.com/Lancetnik/slop-writer/issues"

# The dev CLIs stay PEP-723 scripts under `uv run`; this is the shipped
# command — `install`, `init`, `serve`, `uninstall` as of #20.
[project.scripts]
slop-writer = "slop_writer.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# PEP 735, not [project.optional-dependencies]: a dependency group is a
# development-time concept the build backend never writes into wheel metadata,
# so pytest cannot reach a user who installs `slop-writer`. An extra would.
# CI asserts this against the built wheel rather than trusting the claim.
[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
# The suite must exercise *this checkout*, never the released package — the
# same trap tools/check_schema_doc.py pins its own dependency against. `uv run
# pytest` installs the project editable, and tests/test_packaging.py asserts
# the result, so a stale wheel fails loudly instead of passing quietly.
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

# The skill ships inside the wheel so `slop-writer install` can copy it out
# (#19) and one version covers both (#21). It cannot live under
# `src/slop_writer/`: the same directory is what `npx skills add` serves from
# the repository root, and uv_build packs only files under the module root —
# a symlink into `skills/` fails the build outright. Purelib data is what
# bridges the two: the directory installs *beside* the package in
# site-packages, and `install.skill_source` looks for it there.
[tool.uv.build-backend]
data = { purelib = "skills" }

